---
name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Extract metadata
        run: |
          V=$(awk -F' = ' '/^mod_version/{print $2}' gradle.properties | tr -d ' ')
          MC=$(awk -F' = ' '/^minecraft_version/{print $2}' gradle.properties | tr -d ' ')
          PL=$(awk -F' = ' '/^enabled_platforms/{print $2}' gradle.properties | tr -d ' ')
          echo "VERSION=$V" >> $GITHUB_ENV
          echo "MC_VERSION=$MC" >> $GITHUB_ENV
          echo "PLATFORMS=$PL" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${V}+mc${MC}" >> $GITHUB_ENV

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            --title "v${{ env.VERSION }} for MC ${{ env.MC_VERSION }}" \
            --generate-notes \
            fabric/build/libs/tritiumcompanion-fabric-${{ env.VERSION }}.jar \
            neoforge/build/libs/tritiumcompanion-neoforge-${{ env.VERSION }}.jar

      - name: Fetch existing manifest from gh-pages
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse origin/gh-pages >/dev/null 2>&1; then
            git show origin/gh-pages:companion-versions.json \
              > companion-versions.json 2>/dev/null || true
          fi

      - name: Build companion-versions.json
        run: python3 .github/scripts/build-manifest.py

      - name: Deploy companion-versions.json to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./manifest-build
          publish_branch: gh-pages
          keep_files: false
