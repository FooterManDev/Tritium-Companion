pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        gradlePluginPortal()
    }
}

rootProject.name = 'tritiumcompanion'

include 'common'
include 'fabric'
include 'neoforge'

includeBuild('Tritium-Mod-API') {
    dependencySubstitution {
        substitute module('io.github.tritium_launcher:tritium-mod-api') using project(':')
    }
}
