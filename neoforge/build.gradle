plugins {
    id 'com.gradleup.shadow'
}

def bundledLibraries = rootProject.ext.has("companionBundledLibraries")
        ? rootProject.ext.companionBundledLibraries
        : []

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    modCompileOnly "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.367"
    modLocalRuntime "dev.latvian.mods:kubejs-neoforge:2101.7.2-build.367"

    implementation "dev.latvian.apps:tiny-java-server:1.0.0-build.33"
    runtimeOnly "dev.latvian.apps:tiny-java-server:1.0.0-build.33"
    forgeRuntimeLibrary "dev.latvian.apps:tiny-java-server:1.0.0-build.33"

    modLocalRuntime "me.shedaniel:RoughlyEnoughItems-neoforge:16.0.799"

    bundledLibraries.each { dep ->
        implementation dep
        runtimeOnly dep
        shadowBundle(dep) { transitive = false }
        forgeRuntimeLibrary dep
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
